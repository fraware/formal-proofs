name: lean4-ci

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Lean
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          lake-package-directory: .lake/packages

      - name: Verify toolchain pin
        run: |
          test -f lean-toolchain
          grep -q "leanprover/lean4:stable" lean-toolchain

      - name: Lake update
        run: lake update

      - name: Build
        run: lake build

      - name: Enforce no placeholders in Lean4 sources
        run: |
          ! rg -n --glob "Verification/**/*.lean" '\bsorry\b|TODO|FIXME|placeholder|stub|NotImplemented'
